name: Vocab Flashcards tests

on:
  push:
    paths:
      - 'vocab-flashcards/**'
      - '.github/workflows/vocab-flashcards-tests.yml'
  pull_request:
    paths:
      - 'vocab-flashcards/**'
      - '.github/workflows/vocab-flashcards-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vocab-flashcards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vocab-flashcards/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: vocab-flashcards/playwright-report/
          retention-days: 7
